name: Build Shadow Cat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prepare project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/shadowcat/kunai
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/shadowcat/kunai/MainActivity.java
          cp ShadowCat_v08_fixed.html app/src/main/assets/index.html
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.shadowcat.kunai'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.shadowcat.kunai'
                  minSdk 23
                  targetSdk 35
                  versionCode 8
                  versionName '0.8'
              }
          }
          EOF

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowCat-v08-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
