<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Shadow Cat: Kunai v0.5</title><style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130d2c;color:#fff;font-family:system-ui,Arial}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}.pill{background:#1b103bdc;border:2px solid #9865d7;border-radius:12px;padding:5px 9px;font-weight:800;font-size:clamp(11px,2.8vw,15px);text-shadow:1px 1px #24103b;box-shadow:0 3px 0 #3c1d66}#shopBtn{pointer-events:auto;color:white;background:#6328a6;border:2px solid #b58aff;border-radius:12px;padding:7px 12px;font-weight:bold}#controls{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}.cluster{display:flex;gap:9px}.control{width:clamp(55px,17vw,76px);height:clamp(55px,17vw,76px);border-radius:15px;border:3px solid #a779e8;background:#30135fdc;color:#e7caff;font-size:clamp(23px,7vw,34px);font-weight:900;box-shadow:0 5px 0 #17082e}.control:active{background:#7638b5}.small{width:clamp(48px,14vw,64px);height:clamp(48px,14vw,64px)}#shop,#start,#pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#09051bdc;padding:12px}#start{display:flex}.panel,.startbox{width:min(430px,94vw);background:linear-gradient(#29124e,#160b35);border:3px solid #a879e9;border-radius:18px;padding:15px;box-shadow:0 0 24px #7f43c966}.panel h2{text-align:center;margin:0 0 9px}.upgrade{display:flex;align-items:center;gap:9px;padding:9px;margin:7px 0;background:#32185a;border:1px solid #7544b4;border-radius:12px}.upgrade .desc{flex:1;font-size:13px}.upgrade button,.startbox button,#close{background:#7838bd;color:#fff;border:2px solid #bd91ff;border-radius:10px;padding:9px;font-weight:bold}.startbox{text-align:center}.startbox h1{font-size:clamp(25px,7vw,38px);margin:0 0 10px;color:#f0c9ff;text-shadow:3px 3px #5c2d98}.startbox p{line-height:1.4}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#4e1b83;border:2px solid #d0a2ff;padding:7px 12px;border-radius:12px;display:none;font-weight:bold}

/* v0.7 portrait phone layout */
@media (orientation: portrait) {
  #hud { top:7px; left:7px; right:7px; gap:5px; max-width:100%; }
  .pill { padding:5px 7px; border-radius:10px; font-size:clamp(10px,3.1vw,13px); }
  #shopBtn { padding:5px 8px; font-size:12px; }
  #statHud { flex-basis:100%; width:max-content; max-width:fit-content; }
  #controls { bottom:max(12px, env(safe-area-inset-bottom)); left:9px; right:9px; }
  .cluster { gap:7px; }
  .control { width:clamp(58px,18vw,74px); height:clamp(58px,18vw,74px); border-radius:16px; }
  .small { width:clamp(52px,15vw,65px); height:clamp(52px,15vw,65px); }
  #toast { top:100px; max-width:90vw; text-align:center; }
}
@media (orientation: landscape) and (max-height: 500px) {
  #hud { gap:4px; top:4px; }
  .pill { padding:3px 6px; font-size:11px; }
  #controls { bottom:6px; }
  .control { width:52px; height:52px; }
}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="pill">🐱 Shadow Cat</div><div class="pill" id="coinHud">🪙 0</div><div class="pill" id="hpHud">❤️ ❤️ ❤️</div><div class="pill" id="xpHud">Ур. 1 · 0/100</div><button id="shopBtn">🛒 Магазин</button><div class="pill" id="statHud">⚔ 50 · 🛡 0% · 🏃 0%</div></div><div id="toast"></div><div id="controls"><div class="cluster"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><div class="cluster"><button class="control" id="jump">⬆</button><button class="control small" id="attack">🗡</button></div></div><div id="shop"><div class="panel"><h2>✨ Улучшения</h2><p style="text-align:center">10 монет за уровень · +2%</p><div id="items"></div><button id="close" style="width:100%">Продолжить</button></div></div><div id="start"><div class="startbox"><h1>Shadow Cat: Kunai</h1><p>Ночная Япония · Кошка-ниндзя<br>Игра в вертикальном режиме 📱<br>Собирай монеты, сражайся и улучшай навыки!</p><button id="startBtn">Играть</button></div></div><div id="pause"><div class="startbox"><h1>Пауза</h1><button id="resume">Продолжить</button></div></div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d');let cw,ch,scale;function resize(){scale=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=innerWidth*scale;canvas.height=innerHeight*scale;cw=innerWidth;ch=innerHeight;ctx.setTransform(scale,0,0,scale,0,0)}resize();onresize=resize;
let save=JSON.parse(localStorage.getItem('shadowcatSave')||'{}'),coins=save.coins||0,levels=save.levels||{damage:0,defense:0,speed:0};let hp=3,xp=0,level=1,player={x:70,y:0,vx:0,vy:0,w:24,h:34,ground:false,dir:1,atk:0,inv:0};let world=3200,cam=0,gravity=850,run=false,paused=false,shopOpen=false,t=0;
const floor=()=>ch-92;let plats=[];function buildPlatforms(){let f=floor(),wf=cw<500?.78:1;plats=[{x:0,y:f,w:410*wf},{x:485,y:f-55,w:180*wf},{x:735,y:f-12,w:215*wf},{x:1030,y:f-95,w:190*wf},{x:1300,y:f-42,w:235*wf},{x:1640,y:f-112,w:200*wf},{x:1920,y:f-35,w:260*wf},{x:2260,y:f-85,w:230*wf},{x:2580,y:f-15,w:260*wf},{x:2920,y:f-100,w:220*wf}]}buildPlatforms();
let coinsArr=[];plats.forEach(p=>{let n=Math.max(1,Math.floor(p.w/115));for(let i=0;i<n;i++)coinsArr.push({x:p.x+40+i*(p.w-80)/Math.max(1,n-1),y:p.y-39-(i%2)*9,got:false,phase:Math.random()*6})});let enemies=plats.slice(0,9).map((p,i)=>({x:p.x+p.w*.68,base:p.x+p.w*.68,y:p.y-29,alive:true,hp:100,dir:i%2? -1:1,alert:0,hit:0})).filter(e=>e.x>200);
const dmg=()=>50*(1+levels.damage*.02),speed=()=>185*(1+levels.speed*.02),def=()=>Math.min(.8,levels.defense*.02);function persist(){localStorage.setItem('shadowcatSave',JSON.stringify({coins,levels}))}
function updateHud(){document.querySelector('#coinHud').textContent='🪙 '+coins;document.querySelector('#hpHud').textContent='❤️ '.repeat(hp)+'♡ '.repeat(3-hp);document.querySelector('#xpHud').textContent=`Ур. ${level} · ${xp}/100`;document.querySelector('#statHud').textContent=`⚔ ${Math.round(dmg())} · 🛡 ${Math.round(def()*100)}% · 🏃 ${levels.speed*2}%`;renderShop()}
function renderShop(){document.querySelector('#items').innerHTML=[['damage','⚔️ Урон',`Сила куная ${Math.round(dmg())}`],['defense','🛡️ Защита',`Защита ${Math.round(def()*100)}%`],['speed','👟 Скорость',`Скорость ${Math.round(speed())}`]].map(([k,n,d])=>`<div class="upgrade"><div class="desc"><b>${n} · ур. ${levels[k]}</b><br>${d}<br>+2% за уровень</div><button data-buy="${k}">Купить · 10 🪙</button></div>`).join('')}
document.querySelector('#items').onclick=e=>{let b=e.target.closest('[data-buy]');if(!b)return;if(coins<10){toast('Не хватает монет');return}coins-=10;levels[b.dataset.buy]++;persist();updateHud();toast('Улучшение куплено!')};function toast(s){let el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',1200)}
const keys={left:false,right:false,jump:false,attack:false};function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false}bind('left','left');bind('right','right');bind('jump','jump');bind('attack','attack');document.querySelector('#shopBtn').onclick=()=>{shopOpen=true;document.querySelector('#shop').style.display='flex'};document.querySelector('#close').onclick=()=>{shopOpen=false;document.querySelector('#shop').style.display='none'};document.querySelector('#startBtn').onclick=()=>{run=true;document.querySelector('#start').style.display='none';player.y=floor()-player.h};document.querySelector('#resume').onclick=()=>{paused=false;document.querySelector('#pause').style.display='none'};document.querySelector('#pause').onclick=e=>{if(e.target.id==='pause'){paused=false;e.currentTarget.style.display='none'}};document.addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))keys.left=true;if(['ArrowRight','d'].includes(e.key))keys.right=true;if(['ArrowUp','w',' '].includes(e.key))keys.jump=true;if(e.key==='z'||e.key==='x')keys.attack=true;if(e.key==='Escape'){paused=!paused;document.querySelector('#pause').style.display=paused?'flex':'none'}});document.addEventListener('keyup',e=>{if(['ArrowLeft','a'].includes(e.key))keys.left=false;if(['ArrowRight','d'].includes(e.key))keys.right=false;if(['ArrowUp','w',' '].includes(e.key))keys.jump=false;if(e.key==='z'||e.key==='x')keys.attack=false});
// Pixel palette & tiny drawing helpers
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function px(x,y,c){rect(x,y,3,3,c)}function bg(){let g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#27134e');g.addColorStop(.55,'#5b3c96');g.addColorStop(1,'#21134b');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch); // moon
ctx.fillStyle='#e8c2ff';ctx.beginPath();ctx.arc(cw*.49,ch*.20,Math.min(cw,ch)*.115,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d1a6f5';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(cw*.49+Math.sin(i*3)*30,ch*.2+Math.cos(i*5)*25,4+i%3*3,0,6.28);ctx.fill()}
// silhouette castles scrolling parallax
for(let layer=0;layer<3;layer++){let offset=(cam*(.08+layer*.08))% (cw+240);for(let i=-1;i<5;i++){let bx=i*260-offset,base=ch*.68+layer*36;rect(bx,base-80-layer*20,100,base?130:100,'#34205f');for(let k=0;k<3;k++){rect(bx-12-k*8,base-90-layer*20-k*27,124+k*16,9,'#211448');rect(bx+22,base-74-layer*20-k*27,56,18,'#4d327b');}for(let win=0;win<4;win++)rect(bx+18+win*18,base-52,6,11,'#ffcc83')}}
// torii, sakura branches
for(let i=0;i<4;i++){let x=i*520-cam*.35+80;rect(x, ch*.56,10,100,'#7a245b');rect(x+95,ch*.56,10,100,'#7a245b');rect(x-12,ch*.56-8,130,12,'#a6427b');rect(x-25,ch*.56-23,155,12,'#6f285e');for(let j=0;j<16;j++){let xx=x+Math.sin(j*5)*95,yy=ch*.53+Math.cos(j*4)*30;rect(xx,yy,10,9,j%2?'#b94eae':'#d16cc8')}}}
function platformDraw(p){let x=p.x-cam;if(x+p.w<0||x>cw)return;rect(x,p.y,p.w,14,'#d875f2');rect(x,p.y+4,p.w,5,'#a755d4');for(let i=0;i<p.w;i+=12){rect(x+i,p.y+13,11,Math.min(35,ch-p.y-13),'#35205d');rect(x+i,p.y+18,6,10,'#512b83')}rect(x,p.y+14,p.w,5,'#20143e')}
// Pixel catgirl, animation via pose offsets. sprite centered at foot.
function heroDraw(x,y,dir,mode,frame,attack){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(dir,1);let bob=mode==='run'?Math.sin(frame*12)*2:mode==='jump'?-2:Math.sin(frame*3)*.3; // scarf tail
rect(-7,-26+bob,6,6,'#4a235f');rect(-12,-23+bob,6,5,'#201238');rect(-16,-21+bob,7,4,'#be4c9d');rect(-20,-17+bob,7,4,'#e16cba'); // legs
let stride=mode==='run'?Math.sin(frame*12)*4:0;rect(-8,-11+stride,6,9,'#241740');rect(-9,-3+stride,10,4,'#4c2c7a');rect(2,-11-stride,6,9,'#241740');rect(1,-3-stride,11,4,'#4c2c7a'); // body
rect(-8,-24+bob,16,14,'#35215e');rect(-7,-21+bob,14,4,'#bc438d');rect(-2,-18+bob,4,5,'#f5d0ef');rect(-8,-15+bob,16,4,'#19132f'); // arms
let arm=mode==='run'?stride*.6:attack? -6:0;rect(-11,-22+bob,5,9+arm/3,'#35215e');rect(7,-22+bob,5,9-arm/3,'#35215e');rect(-12,-14+bob,5,4,'#edc4ef');rect(8,-14+bob,5,4,'#edc4ef'); // head
rect(-11,-38+bob,22,18,'#25203f');rect(-9,-40+bob,18,16,'#28203f');rect(-12,-44+bob,8,10,'#251a43');rect(-12,-47+bob,6,8,'#ed9fd5');rect(5,-44+bob,8,10,'#251a43');rect(7,-47+bob,6,8,'#ed9fd5');rect(-8,-38+bob,16,12,'#f2c9e9');rect(-10,-38+bob,6,7,'#27203e');rect(4,-38+bob,6,7,'#27203e');rect(-7,-34+bob,4,4,'#d44ea6');rect(4,-34+bob,4,4,'#d44ea6');rect(-2,-30+bob,4,2,'#9c4c83'); // hair fringe
rect(-9,-39+bob,5,6,'#27203e');rect(-4,-39+bob,6,4,'#27203e');rect(2,-40+bob,6,6,'#27203e');rect(-8,-43+bob,16,4,'#27203e');rect(-12,-37+bob,4,7,'#27203e');rect(8,-37+bob,4,7,'#27203e'); // kunai
if(attack){rect(12,-24+bob,14,3,'#dddaf8');rect(23,-28+bob,6,6,'#d8e8ff');rect(12,-24+bob,3,6,'#8e55c5')}else{rect(10,-21+bob,12,3,'#d7e4ff');rect(20,-24+bob,5,6,'#d7e4ff');rect(10,-20+bob,3,5,'#9b67cc')}ctx.restore()}
function enemyDraw(e){let x=e.x-cam,y=e.y,walk=Math.sin(t*9+e.x)*2;rect(x-8,y-12+walk,7,9,'#211435');rect(x+1,y-12-walk,7,9,'#211435');rect(x-10,y-3,20,11,'#201538');rect(x-11,y-23,22,17,'#181127');rect(x-8,y-25,16,14,'#211538');rect(x-12,y-28,6,8,'#211538');rect(x+6,y-28,6,8,'#211538');rect(x-8,y-17,16,5,'#d94a90');rect(x-6,y-16,3,3,'#fff0b8');rect(x+3,y-16,3,3,'#fff0b8');rect(x-12,y-9,5,9,'#2c1a4c');rect(x+7,y-9,5,9,'#2c1a4c');rect(x+10,y-10,14,3,'#c5d9ff');rect(x+21,y-13,5,5,'#e4eaff');if(e.hp<100){rect(x-14,y-36,28,4,'#32102b');rect(x-14,y-36,28*e.hp/100,3,'#f24573')}}
function drawCoin(c){let xx=c.x-cam,yy=c.y+Math.sin(t*5+c.phase)*3;rect(xx-5,yy-8,10,16,'#ffb524');rect(xx-3,yy-7,6,14,'#ffe568');rect(xx-1,yy-5,2,10,'#fff3b0');px(xx-8,yy-7,'#fff1a6');px(xx+6,yy+6,'#fff1a6')}
function update(dt){t+=dt;if(!run||paused||shopOpen)return;let move=(keys.right?1:0)-(keys.left?1:0);player.vx=move*speed();if(move)player.dir=move;if(keys.jump&&player.ground){player.vy=-390;player.ground=false}player.vy+=gravity*dt;let oldY=player.y;player.x=Math.max(0,Math.min(world-30,player.x+player.vx*dt));player.y+=player.vy*dt;player.ground=false;for(let p of plats){if(player.vy>=0&&oldY+player.h<=p.y+3&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.ground=true}}if(player.y>ch+80){hp--;player.x=Math.max(40,player.x-150);player.y=floor()-player.h;player.vy=0;if(hp<=0)hp=3;updateHud();toast('Осторожно!')}
if(keys.attack&&player.atk<=0){player.atk=.25;for(let e of enemies){if(e.alive&&Math.abs(e.x-(player.x+player.dir*38))<42&&Math.abs(e.y-player.y)<45){e.hp-=dmg();e.hit=.15;if(e.hp<=0){e.alive=false;coins+=5;xp+=25;toast('+5 монет · +25 XP');if(xp>=100){xp-=100;level++;toast('Новый уровень!')}persist();updateHud()}}}}player.atk=Math.max(0,player.atk-dt);if(player.inv>0)player.inv-=dt;
for(let c of coinsArr)if(!c.got&&Math.abs(c.x-player.x-12)<23&&Math.abs(c.y-player.y-18)<33){c.got=true;coins++;xp+=5;persist();updateHud()}
for(let e of enemies)if(e.alive){let dx=player.x-e.x;if(Math.abs(dx)<145){e.alert=1;e.dir=dx>0?1:-1;e.x+=e.dir*78*dt}else{e.alert=0;e.x+=e.dir*42*dt;if(e.x<e.base-50)e.dir=1;if(e.x>e.base+50)e.dir=-1}if(Math.abs(e.x-player.x)<25&&Math.abs(e.y-player.y)<29&&player.inv<=0){hp--;player.inv=1;player.x-=player.dir*32;if(hp<=0){hp=3;player.x=60;toast('Возрождение')}updateHud()}}
cam=Math.max(0,Math.min(world-cw,player.x-cw*.36));if(player.x>world-80){coins+=30;player.x=50;coinsArr.forEach(c=>c.got=false);enemies.forEach(e=>{e.alive=true;e.hp=100;e.x=e.base});persist();updateHud();toast('Уровень пройден! +30 монет')}}
function draw(){bg(); // sakura falling particles
for(let i=0;i<18;i++){let sx=(i*113+t*18-cam*.22)% (cw+20);if(sx<0)sx+=cw;let sy=(i*67+t*22)%ch;rect(sx,sy,4,3,'#ef9ce5')}
for(let p of plats)platformDraw(p);for(let c of coinsArr)if(!c.got)drawCoin(c);enemies.forEach(e=>{if(e.alive)enemyDraw(e)});if(player.inv>0&&Math.floor(t*16)%2===0){}else heroDraw(player.x-cam,player.y+player.h,player.dir,player.ground?(Math.abs(player.vx)>1?'run':'idle'):'jump',t,player.atk>0); // finish gate
let gx=world-50-cam;rect(gx,ch*.48,9,ch*.22,'#9c46b8');rect(gx+35,ch*.48,9,ch*.22,'#9c46b8');rect(gx-9,ch*.48-12,62,9,'#d78bff');rect(gx-17,ch*.48-25,78,9,'#7539a3');}
let last=0;function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}updateHud();requestAnimationFrame(loop);
</script></body></html>
